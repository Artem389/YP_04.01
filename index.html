<!DOCTYPE html>
<html>
<head>
  <base href="/YP_04.01/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Продуктовый магазин">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Продуктовый магазин</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
    }
    .boot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #2e7d32;
    }
    .boot__title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 24px;
    }
    .boot__spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(46, 125, 50, 0.2);
      border-top-color: #2e7d32;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="boot" id="boot-loader">
  <div class="boot__title">Продуктовый магазин</div>
  <div class="boot__spinner"></div>
</div>

<script src="flutter_bootstrap.js" async></script>
<script>
  // Скрываем заглушку, когда Flutter сообщит о первом кадре.
  window.addEventListener('flutter-first-frame', function () {
    var el = document.getElementById('boot-loader');
    if (el && el.parentNode) el.parentNode.removeChild(el);
  });
</script>
</body>
</html>
